<div class="title">ITASCA 插件接口。 </div> </div>
</div><!--header-->
<div class="contents">
<div class="textblock"><p>Itasca 接口允许访问内部数据结构和算法。<br/>
<br/>
 因此它极其危险——没有任何办法（即使在理论上）能阻止用户编写会使程序崩溃或产生错误结果的代码。<br/>
<br/>
 对程序数据的访问通常从 IProgram 接口开始，可以把它看作所有可用接口构成的树的根。<br/>
<br/>
 通常，程序特定的数据（Flac3D、3DEC、PFC 等）可通过 IFLAC3D 接口获得，该接口在每个程序中的定义各不相同。<br/>
<br/>
</p>
