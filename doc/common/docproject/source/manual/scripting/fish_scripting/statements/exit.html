<span id="fish-statement-exit"></span><h1>退出（Exit）</h1>
<p><span class="fishname">exit</span></p>
<p>该语句无条件跳转到当前函数的末尾，并将当前正在执行的 <span class="codename">FISH</span> 符号的当前值作为函数值返回。</p>
<p>关于在退出函数或运算子的同时返回数值的另一种方式，见 <a class="reference internal" href="return.html#fish-statement-return"><span class="std std-ref">return</span></a> 语句。</p>
