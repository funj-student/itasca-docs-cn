name: Terminology and admonition check
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements-checks.txt
      - run: python -B -m unittest discover -s tests -v
      - run: python scripts/check_terms.py
      - run: python scripts/check_links.py --known-missing scripts/known-missing-images.json
      - run: python scripts/check_mobile_layout.py
