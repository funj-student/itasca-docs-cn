name: Desktop browser smoke check

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned Playwright
        run: npm ci --no-audit --no-fund

      - name: Install pinned Chromium and WebKit builds
        run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 20

      - name: Run desktop smoke assertions
        run: |
          python3 tests/pages_server.py . 8765 > "$RUNNER_TEMP/desktop-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/itasca-docs-cn/index.html > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/itasca-docs-cn/index.html > /dev/null
          node tests/desktop_browser_check.mjs
        env:
          PHASE: ci
          BASE_URL: http://127.0.0.1:8765/itasca-docs-cn
          OUT: ${{ runner.temp }}/desktop-browser-artifacts
          ENGINES: chromium,webkit
          WIDTHS: 960,1280,1920
          PAGES: index.html,doc/search.html,doc/flac3d/zone/doc/manual/zone_manual/zone_commands/cmd_zone.dynamic.html

      - name: Upload desktop report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-browser-report
          path: ${{ runner.temp }}/desktop-browser-artifacts
          if-no-files-found: ignore
